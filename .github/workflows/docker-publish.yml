name: Docker
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Rebuild pinned inputs; updates are explicit reviewed changes.
    - cron: '17 4 1 * *'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build image on native host
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker build --progress plain -t rustxc:test . > "$RUNNER_TEMP/evidence/image.log" 2>&1
          docker image inspect rustxc:test > "$RUNNER_TEMP/evidence/image.json"
      - name: Native C, C++, assembly, discovery and Rust smoke
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" -v "$RUNNER_TEMP/evidence:/evidence" \
            -v rustxc-ci-xwin:/opt/xwin -e RUSTXC_EVIDENCE_DIR=/evidence rustxc:test /opt/rustxc/smoke \
            aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu powerpc64le-unknown-linux-gnu \
            aarch64-apple-darwin x86_64-apple-darwin \
            x86_64-pc-windows-msvc aarch64-pc-windows-msvc \
            > "$RUNNER_TEMP/evidence/smoke.log" 2>&1
      - name: Alternate pinned Rust toolchain
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" -v "$RUNNER_TEMP/evidence:/evidence" \
            -e RUSTUP_TOOLCHAIN=1.96.0 -e RUSTXC_EVIDENCE_DIR=/evidence/rust196 \
            rustxc:test /opt/rustxc/smoke x86_64-unknown-linux-gnu \
            > "$RUNNER_TEMP/evidence/rust196.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smoke-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/evidence/*.log
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.txt
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
      - name: Sign image index
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
